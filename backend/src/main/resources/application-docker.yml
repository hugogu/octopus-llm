spring:
  datasource:
    url: jdbc:postgresql://db:5432/${DB_NAME:octopus_llm}
app:
  network:
    trusted-proxies: ${TRUSTED_PROXIES:}
  anonymous-visitor:
    hmac-secret: ${ANONYMOUS_VISITOR_HMAC_SECRET}
  render:
    plantuml:
      server-url: ${PLANTUML_SERVER_URL:http://plantuml:8080}
      max-source-bytes: ${PLANTUML_MAX_SOURCE_BYTES:102400}
