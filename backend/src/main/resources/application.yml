spring:
  main:
    web-application-type: reactive
  codec:
    # Allow aggregating an uploaded media part into memory up to the largest per-file limit + headroom
    # (feature 007). Parts above this stream to a temp file.
    max-in-memory-size: 16MB
  webflux:
    multipart:
      max-in-memory-size: 16MB
      max-disk-usage-per-part: 32MB
      max-parts: 16
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/octopus_llm}
    username: ${DB_USER:octopus}
    password: ${DB_PASSWORD:octopus}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  connections:
    allow-local-http: ${ALLOW_LOCAL_CONNECTION_HTTP:false}
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  network:
    trusted-proxies: ${TRUSTED_PROXIES:}
  anonymous-visitor:
    hmac-secret: ${ANONYMOUS_VISITOR_HMAC_SECRET:local-development-anonymous-visitor-secret}
  anonymous:
    rate-limit: ${ANONYMOUS_RATE_LIMIT:20}
    rate-window-seconds: ${ANONYMOUS_RATE_WINDOW_SECONDS:60}
    concurrency-limit: ${ANONYMOUS_CONCURRENCY_LIMIT:2}
    prompt-max-bytes: ${ANONYMOUS_PROMPT_MAX_BYTES:12000}
    history-max-bytes: ${ANONYMOUS_HISTORY_MAX_BYTES:48000}
    history-max-turns: ${ANONYMOUS_HISTORY_MAX_TURNS:20}
    model-max-count: ${ANONYMOUS_MODEL_MAX_COUNT:4}
    execution-timeout-seconds: ${ANONYMOUS_EXECUTION_TIMEOUT_SECONDS:120}
    operation-max-targets: ${ANONYMOUS_OPERATION_MAX_TARGETS:1000}
    sync-max-conversations: ${ANONYMOUS_SYNC_MAX_CONVERSATIONS:20}
    sync-max-body-bytes: ${ANONYMOUS_SYNC_MAX_BODY_BYTES:5242880}
  render:
    plantuml:
      server-url: ${PLANTUML_SERVER_URL:http://localhost:8080}
      max-source-bytes: ${PLANTUML_MAX_SOURCE_BYTES:102400}

# Media storage (feature 007). Local backend serves files statically at media.local.public-base-url;
# switch to S3/OSS at runtime via the admin storage settings.
media:
  local:
    dir: ${MEDIA_LOCAL_DIR:./data/media}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080/media}

# Optional artifact passphrase for admin data migration (feature 008). Memory-only, like the
# encryption master key — never logged or persisted. When set, admins may export/import without
# typing a passphrase; a request-supplied passphrase always overrides this value.
migration:
  artifact-passphrase: ${MIGRATION_ARTIFACT_PASSPHRASE:}

# Cross-provider model capability detection (feature 007). OpenRouter's public models list exposes
# per-model input modalities; the key is optional (the list endpoint is public) but sent when present.
openrouter:
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  api-key: ${OPENROUTER_API_KEY:}
