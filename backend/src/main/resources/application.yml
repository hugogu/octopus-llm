spring:
  main:
    web-application-type: reactive
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/octopus_llm}
    username: ${DB_USER:octopus}
    password: ${DB_PASSWORD:octopus}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  connections:
    allow-local-http: ${ALLOW_LOCAL_CONNECTION_HTTP:false}
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
