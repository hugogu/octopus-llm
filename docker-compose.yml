services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-octopus_llm}
      POSTGRES_USER: ${DB_USER:-octopus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-octopus}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-octopus} -d ${DB_NAME:-octopus_llm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-octopus_llm}
      DB_USER: ${DB_USER:-octopus}
      DB_PASSWORD: ${DB_PASSWORD:-octopus}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_SECONDS: ${JWT_EXPIRY_SECONDS:-3600}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ANONYMOUS_VISITOR_HMAC_SECRET: ${ANONYMOUS_VISITOR_HMAC_SECRET:-local-development-anonymous-visitor-secret}
      PLANTUML_SERVER_URL: ${PLANTUML_SERVER_URL:-http://plantuml:8080}
      PLANTUML_MAX_SOURCE_BYTES: ${PLANTUML_MAX_SOURCE_BYTES:-102400}
      # Media storage (feature 007). Local backend writes here and serves it unauthenticated at
      # MEDIA_PUBLIC_BASE_URL; switch to S3/OSS at runtime via the admin storage settings.
      MEDIA_LOCAL_DIR: ${MEDIA_LOCAL_DIR:-/app/media}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:8080/media}
    volumes:
      - ./data/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      plantuml:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8080}
      BROWSER_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  # Self-hosted PlantUML renderer (clarification Q1). Internal only — no published host port;
  # the backend reaches it on the compose network and proxies browser requests so model content
  # never leaves the platform trust boundary.
  plantuml:
    image: plantuml/plantuml-server:jetty-v1.2026.6
    expose:
      - "8080"
    environment:
      # Allow inbound diagram size up to the backend's configured cap.
      PLANTUML_LIMIT_SIZE: "8192"

  # Optional S3/OSS-compatible object store for local development of the media storage backend
  # (feature 007). Start with: `docker compose --profile s3-dev up minio`.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    profiles: ["s3-dev"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./data/minio:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
