services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-octopus_llm}
      POSTGRES_USER: ${DB_USER:-octopus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-octopus}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-octopus} -d ${DB_NAME:-octopus_llm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-octopus_llm}
      DB_USER: ${DB_USER:-octopus}
      DB_PASSWORD: ${DB_PASSWORD:-octopus}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_SECONDS: ${JWT_EXPIRY_SECONDS:-3600}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ANONYMOUS_VISITOR_HMAC_SECRET: ${ANONYMOUS_VISITOR_HMAC_SECRET:-local-development-anonymous-visitor-secret}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8080}
      BROWSER_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
